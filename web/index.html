<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#123f50">
  <title>Visit Compliance — Top Management</title>
  <style>
    :root {
      --page: #f4f8fb;
      --surface: #ffffff;
      --surface-2: #f6fafc;
      --surface-3: #eaf2f6;
      --hero: #123f50;
      --hero-2: #0d3444;
      --text: #09283a;
      --muted: #657a89;
      --border: #d4e2e9;
      --border-strong: #b9d0dc;
      --accent: #1183a4;
      --accent-strong: #086f8f;
      --success: #18a56b;
      --success-soft: #d9f4e6;
      --danger: #df4d59;
      --danger-soft: #ffe2e5;
      --warning: #f29b0a;
      --warning-soft: #fff0cf;
      --blue: #1787aa;
      --blue-soft: #dff1f8;
      --shadow: 0 12px 32px rgba(15, 54, 73, .08);
      --shadow-strong: 0 24px 70px rgba(7, 35, 51, .22);
      --radius: 17px;
      --radius-sm: 11px;
      --focus: 0 0 0 3px rgba(17, 131, 164, .22);
    }

    html[data-theme="dark"] {
      --page: #07131d;
      --surface: #0d1d29;
      --surface-2: #102532;
      --surface-3: #183343;
      --hero: #0d3546;
      --hero-2: #092936;
      --text: #edf8fd;
      --muted: #9eb5c3;
      --border: #244354;
      --border-strong: #356074;
      --accent: #37b7d8;
      --accent-strong: #66d4ef;
      --success: #43d692;
      --success-soft: rgba(39, 191, 123, .16);
      --danger: #ff7180;
      --danger-soft: rgba(255, 86, 106, .16);
      --warning: #ffbd4a;
      --warning-soft: rgba(255, 174, 31, .17);
      --blue: #47b8de;
      --blue-soft: rgba(45, 168, 210, .17);
      --shadow: 0 18px 42px rgba(0, 0, 0, .24);
      --shadow-strong: 0 30px 90px rgba(0, 0, 0, .55);
      --focus: 0 0 0 3px rgba(55, 183, 216, .25);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 92% 0%, rgba(36, 164, 194, .08), transparent 30rem),
        var(--page);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      transition: background-color .2s ease, color .2s ease;
    }

    html[data-theme="dark"] body {
      background:
        radial-gradient(circle at 85% 5%, rgba(31, 172, 207, .14), transparent 26rem),
        radial-gradient(circle at 4% 88%, rgba(31, 139, 167, .09), transparent 22rem),
        var(--page);
    }

    button, input, select { font: inherit; }
    button { color: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: none; box-shadow: var(--focus); }
    [hidden] { display: none !important; }

    .shell {
      width: min(1480px, calc(100% - 30px));
      margin: 0 auto;
      padding: 14px 0 36px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
      padding: 0 2px 10px;
      font-weight: 800;
      font-size: 18px;
    }

    .draft-pill {
      padding: 6px 14px;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      color: var(--text);
      background: var(--blue-soft);
      font-size: 12px;
      font-weight: 800;
    }

    .hero {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 138px;
      padding: 23px 24px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--hero), var(--hero-2));
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      right: -125px;
      top: -190px;
      border-radius: 50%;
      border: 48px solid rgba(255,255,255,.035);
      pointer-events: none;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(24px, 2.7vw, 34px);
      line-height: 1.12;
      letter-spacing: -.02em;
    }

    .hero p {
      margin: 5px 0 11px;
      color: #d9edf5;
      font-size: 14px;
    }

    .hero-meta {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .hero-chip, .theme-toggle {
      min-height: 35px;
      padding: 7px 12px;
      border: 1px solid rgba(184, 229, 243, .7);
      border-radius: 10px;
      color: #fff;
      background: rgba(6, 42, 57, .22);
      font-size: 12px;
      font-weight: 750;
      backdrop-filter: blur(8px);
    }

    .live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: #54e7a5;
      box-shadow: 0 0 0 4px rgba(84,231,165,.12), 0 0 14px rgba(84,231,165,.55);
    }

    .theme-toggle:hover, .hero-chip:hover { background: rgba(255,255,255,.1); }

    .panel {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 1px 0 rgba(255,255,255,.02);
    }

    .filter-panel { padding: 13px; }

    .filter-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
    }

    .filter-toolbar h2, .section-head h2 {
      margin: 0;
      font-size: 14px;
      letter-spacing: -.01em;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .btn {
      min-height: 36px;
      padding: 8px 13px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      color: var(--text);
      background: var(--surface);
      font-weight: 750;
      font-size: 12px;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }

    .btn:hover { transform: translateY(-1px); border-color: var(--accent); }
    .btn.primary { border-color: var(--accent); color: #fff; background: var(--accent); }
    .btn.primary:hover { background: var(--accent-strong); }
    .btn.ghost-dark { border-color: rgba(255,255,255,.32); color: #fff; background: rgba(255,255,255,.06); }

    .filter-grid {
      display: grid;
      grid-template-columns: 1.1fr 1.1fr 1.1fr 1.1fr;
      gap: 9px;
    }

    .field {
      display: block;
      min-width: 0;
      padding: 8px 10px 7px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface-2);
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .field:focus-within { border-color: var(--accent); box-shadow: var(--focus); }

    .field span {
      display: block;
      margin-bottom: 1px;
      color: var(--text);
      font-size: 10px;
      font-weight: 800;
    }

    .field input, .field select {
      width: 100%;
      height: 23px;
      padding: 0;
      border: 0;
      outline: 0;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
    }

    .field select { color: var(--text); }
    .field input::placeholder { color: var(--muted); opacity: 1; }

    .tab-panel { padding: 7px; }

    .tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .tab {
      flex: 0 0 auto;
      padding: 7px 13px;
      border: 0;
      border-radius: 10px;
      color: var(--text);
      background: var(--surface-3);
      font-size: 11px;
      font-weight: 800;
    }

    .tab[aria-selected="true"] { color: #fff; background: var(--hero); }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      background: var(--surface);
      font-size: 11px;
    }

    .status-bar.error { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
    .status-bar.success { color: var(--muted); }
    .status-bar strong { color: var(--text); }

    .content { margin-top: 12px; }

    .summary-layout {
      display: grid;
      grid-template-columns: minmax(390px, .86fr) minmax(520px, 1.4fr);
      gap: 12px;
      align-items: start;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .kpi-card {
      position: relative;
      overflow: hidden;
      min-height: 128px;
      padding: 15px 13px 12px;
      border: 1px solid var(--border);
      border-top: 5px solid var(--tone, var(--accent));
      border-radius: 15px;
      color: var(--text);
      text-align: left;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    .kpi-card::after {
      content: "↗";
      position: absolute;
      right: 10px;
      top: 8px;
      color: var(--muted);
      font-size: 13px;
      opacity: 0;
      transform: translate(-3px, 3px);
      transition: opacity .16s ease, transform .16s ease;
    }

    .kpi-card:hover { transform: translateY(-2px); border-color: var(--tone, var(--accent)); box-shadow: 0 15px 34px rgba(8, 49, 68, .13); }
    .kpi-card:hover::after { opacity: 1; transform: translate(0,0); }

    html[data-theme="dark"] .kpi-card:hover { box-shadow: 0 18px 45px rgba(0,0,0,.36), 0 0 24px color-mix(in srgb, var(--tone) 15%, transparent); }

    .kpi-label {
      display: block;
      min-height: 31px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      line-height: 1.2;
      letter-spacing: .075em;
      text-transform: uppercase;
    }

    .kpi-value {
      display: block;
      margin-top: 4px;
      color: var(--text);
      font-size: clamp(30px, 3vw, 40px);
      font-weight: 850;
      line-height: 1;
      letter-spacing: -.035em;
    }

    .kpi-note {
      display: block;
      margin-top: 9px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.25;
    }

    .section-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 14px 9px;
    }

    .section-head p { margin: 0; color: var(--muted); font-size: 10px; }

    .table-wrap {
      width: 100%;
      overflow: auto;
      padding: 0 11px 12px;
      scrollbar-color: var(--border-strong) transparent;
    }

    table { width: 100%; border-collapse: separate; border-spacing: 0 7px; }
    th, td { padding: 9px 10px; white-space: nowrap; text-align: left; }
    th { color: var(--text); background: var(--surface-3); font-size: 10px; font-weight: 850; }
    th:first-child { border-radius: 10px 0 0 10px; }
    th:last-child { border-radius: 0 10px 10px 0; }
    td { border-top: 1px solid transparent; border-bottom: 1px solid transparent; background: var(--surface-2); font-size: 11px; }
    td:first-child { border-left: 1px solid transparent; border-radius: 10px 0 0 10px; }
    td:last-child { border-right: 1px solid transparent; border-radius: 0 10px 10px 0; }
    tbody tr:hover td { border-color: var(--border); background: var(--surface-3); }

    .metric-link {
      min-width: 34px;
      padding: 2px 5px;
      border: 0;
      border-radius: 7px;
      color: var(--text);
      background: transparent;
      font-weight: 750;
      text-align: inherit;
    }
    .metric-link:hover { color: var(--accent); background: var(--blue-soft); }

    .completion-pill, .status-pill, .time-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 850;
    }

    .good { color: #087344; background: var(--success-soft); }
    .mid { color: #945d00; background: var(--warning-soft); }
    .low { color: #b72232; background: var(--danger-soft); }
    html[data-theme="dark"] .good { color: #7af0b7; }
    html[data-theme="dark"] .mid { color: #ffd07b; }
    html[data-theme="dark"] .low { color: #ff9ba5; }

    .status-completed { color: var(--success); background: var(--success-soft); }
    .status-pending { color: var(--danger); background: var(--danger-soft); }
    .status-other { color: var(--accent); background: var(--blue-soft); }
    .status-dot { margin-right: 5px; font-size: 11px; line-height: 1; }

    .time-normal { color: var(--success); background: var(--success-soft); }
    .time-short { color: #a96a00; background: var(--warning-soft); }
    .time-missing { color: var(--danger); background: var(--danger-soft); }
    .time-empty { color: var(--muted); background: transparent; }
    html[data-theme="dark"] .time-short { color: #ffd07b; }

    .empty {
      padding: 38px 18px;
      color: var(--muted);
      text-align: center;
    }
    .empty strong { display: block; margin-bottom: 4px; color: var(--text); font-size: 14px; }

    .definitions-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .definition-card { padding: 18px; }
    .definition-card h3 { margin: 0 0 6px; font-size: 14px; }
    .definition-card p { margin: 0; color: var(--muted); font-size: 12px; }
    .rule-lock {
      grid-column: 1 / -1;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--muted);
      background: var(--surface);
    }
    .rule-lock b { color: var(--text); }

    .drawer-backdrop {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: grid;
      align-items: end;
      padding: 18px;
      background: rgba(1, 13, 21, .58);
      backdrop-filter: blur(8px);
    }

    .drawer {
      display: flex;
      flex-direction: column;
      width: min(1480px, 100%);
      max-height: min(92vh, 980px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow-strong);
      animation: rise .2s ease-out;
    }

    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    .drawer-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, var(--hero), var(--hero-2));
      color: #fff;
    }

    .drawer-head h2 { margin: 0; font-size: 21px; }
    .drawer-head p { margin: 3px 0 0; color: #d5e9f1; font-size: 11px; }
    .drawer-actions { display: flex; gap: 8px; }

    .close-btn {
      width: 37px;
      height: 37px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 10px;
      color: #fff;
      background: rgba(255,255,255,.07);
      font-size: 22px;
      line-height: 1;
    }

    .drawer-body { min-height: 0; overflow: auto; padding: 13px 14px 16px; }

    .drawer-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
      margin-bottom: 11px;
    }

    .mini-kpi {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-align: left;
      background: var(--surface-2);
    }
    button.mini-kpi:hover { border-color: var(--accent); }
    .mini-kpi span { display: block; color: var(--muted); font-size: 9px; font-weight: 850; letter-spacing: .06em; text-transform: uppercase; }
    .mini-kpi strong { display: block; margin-top: 2px; font-size: 22px; line-height: 1.1; }
    .mini-kpi.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

    .drill-table { min-width: 1500px; }
    .drill-table th { position: sticky; z-index: 2; top: -1px; }
    .drill-table td { background: var(--surface); border-color: var(--border); }
    .drill-table tbody tr:hover td { background: var(--surface-2); }

    .table-note { padding: 1px 4px 8px; color: var(--muted); font-size: 10px; }

    .loading-shimmer {
      position: relative;
      overflow: hidden;
      min-height: 250px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .loading-shimmer::after {
      content: "Loading visit snapshot…";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent);
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse { 50% { opacity: .55; } }

    @media (max-width: 1100px) {
      .summary-layout { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: repeat(5, minmax(145px, 1fr)); overflow-x: auto; padding-bottom: 4px; }
      .kpi-card { min-width: 145px; }
    }

    @media (max-width: 820px) {
      .shell { width: min(100% - 18px, 1480px); padding-top: 8px; }
      .hero { align-items: flex-start; padding: 19px; }
      .filter-grid { grid-template-columns: 1fr 1fr; }
      .definitions-grid { grid-template-columns: 1fr 1fr; }
      .drawer-backdrop { padding: 8px; }
      .drawer { max-height: 96vh; border-radius: 17px; }
      .drawer-summary { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 560px) {
      .topline { font-size: 16px; }
      .hero { min-height: 150px; }
      .filter-toolbar { align-items: flex-start; flex-direction: column; }
      .filter-grid { grid-template-columns: 1fr; }
      .definitions-grid { grid-template-columns: 1fr; }
      .drawer-head { padding: 15px; }
      .drawer-actions .btn { display: none; }
      .kpi-grid { grid-template-columns: repeat(5, 150px); }
    }

    @media print {
      .filter-panel, .tab-panel, .theme-toggle, .actions, .draft-pill, .drawer-backdrop { display: none !important; }
      body { background: #fff; }
      .shell { width: 100%; }
      .panel, .section-card, .kpi-card { box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topline">
      <span>Visit — Desktop</span>
      <span class="draft-pill">Management</span>
    </div>

    <section class="hero" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">Visit Compliance</h1>
        <p>Management view · plan, execution and exceptions</p>
        <div class="hero-meta">
          <span class="hero-chip"><span class="live-dot"></span><span id="source-label">Google Drive Live</span></span>
          <span class="hero-chip" id="snapshot-label">Last snapshot: loading…</span>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle colour theme">Dark theme</button>
        </div>
      </div>
    </section>

    <section class="panel filter-panel" aria-labelledby="filter-title">
      <div class="filter-toolbar">
        <h2 id="filter-title">Management filters</h2>
        <div class="actions">
          <button class="btn" id="reset-filters" type="button">Reset all filters</button>
          <button class="btn primary" id="download-visible" type="button">Download visible CSV</button>
        </div>
      </div>
      <div class="filter-grid">
        <label class="field">
          <span>Find outlet</span>
          <input id="outlet-filter" type="search" placeholder="Name or code" autocomplete="off">
        </label>
        <label class="field">
          <span>Visit status</span>
          <select id="status-filter"><option value="">All statuses</option></select>
        </label>
        <label class="field">
          <span>Officer</span>
          <select id="officer-filter"><option value="">All officers</option></select>
        </label>
        <label class="field">
          <span>Search officer</span>
          <input id="officer-search" type="search" placeholder="Type a name" autocomplete="off">
        </label>
      </div>
    </section>

    <nav class="panel tab-panel" aria-label="Dashboard sections">
      <div class="tabs" role="tablist">
        <button class="tab" type="button" role="tab" data-tab="summary" aria-selected="true">Summary</button>
        <button class="tab" type="button" role="tab" data-tab="officers" aria-selected="false">Officers</button>
        <button class="tab" type="button" role="tab" data-tab="outlets" aria-selected="false">Outlets</button>
        <button class="tab" type="button" role="tab" data-tab="definitions" aria-selected="false">Definitions</button>
      </div>
    </nav>

    <div class="status-bar" id="status-bar" role="status">
      <span id="status-text">Connecting to the published dashboard snapshot…</span>
      <button class="btn" id="retry-load" type="button" hidden>Retry</button>
    </div>

    <section class="content" id="content" aria-live="polite">
      <div class="loading-shimmer"></div>
    </section>
  </main>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden>
    <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header class="drawer-head">
        <div>
          <h2 id="drawer-title">Visit details</h2>
          <p id="drawer-subtitle"></p>
        </div>
        <div class="drawer-actions">
          <button class="btn ghost-dark" id="drawer-download" type="button">Download details CSV</button>
          <button class="close-btn" id="drawer-close" type="button" aria-label="Close details">×</button>
        </div>
      </header>
      <div class="drawer-body" id="drawer-body"></div>
    </section>
  </div>

  <script>
    /*
      Presentation-only management interface.
      It reads the already-published dashboard snapshot and never writes to or
      modifies the source workbook, build rules, workflow, or JSON snapshot.
    */
    (() => {
      "use strict";

      const DATA_PATHS = [
        "./data/dashboard_data.json",
        "./data/dashboard_data_last_good.json",
        "./site/data/dashboard_data.json",
        "./site/data/dashboard_data_last_good.json",
        "../site/data/dashboard_data.json",
        "../site/data/dashboard_data_last_good.json",
        "./processed/dashboard_data.json"
      ];

      const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const MAX_RENDER_ROWS = 750;
      const state = {
        payload: null,
        sourceUrl: "",
        rows: [],
        officerSeed: [],
        summarySeed: {},
        asOf: new Date(),
        activeTab: "summary",
        filters: { outlet: "", status: "", officer: "", officerSearch: "" },
        drawer: null
      };

      const $ = (selector, root = document) => root.querySelector(selector);
      const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
      const content = $("#content");
      const statusBar = $("#status-bar");
      const statusText = $("#status-text");

      function token(value) {
        return String(value ?? "").toLowerCase().replace(/[^a-z0-9]+/g, "");
      }

      function esc(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function compact(value) {
        if (value === null || value === undefined) return "";
        return String(value).replace(/\s+/g, " ").trim();
      }

      function objectMap(obj) {
        const map = new Map();
        if (!obj || typeof obj !== "object") return map;
        for (const [key, value] of Object.entries(obj)) map.set(token(key), value);
        return map;
      }

      function getAny(obj, aliases, fallback = "") {
        const map = objectMap(obj);
        for (const alias of aliases) {
          const key = token(alias);
          if (map.has(key)) {
            const value = map.get(key);
            if (value !== null && value !== undefined && value !== "") return value;
          }
        }
        return fallback;
      }

      function numberValue(value) {
        if (typeof value === "number" && Number.isFinite(value)) return value;
        if (value && typeof value === "object") {
          return numberValue(getAny(value, ["value", "count", "total", "number", "metric"], null));
        }
        if (typeof value !== "string") return null;
        const clean = value.replace(/,/g, "").replace(/%/g, "").trim();
        if (!clean) return null;
        const parsed = Number(clean);
        return Number.isFinite(parsed) ? parsed : null;
      }

      function parseDate(value) {
        if (value instanceof Date && !Number.isNaN(value.getTime())) return new Date(value.getTime());
        if (typeof value === "number" && Number.isFinite(value)) {
          const serial = Math.floor(value);
          if (serial > 1000 && serial < 100000) return new Date(Date.UTC(1899, 11, 30 + serial));
          if (value > 100000000000) return new Date(value);
        }
        const raw = compact(value);
        if (!raw || raw === "—" || raw === "-") return null;
        if (/^\d{4}-\d{1,2}-\d{1,2}/.test(raw)) {
          const [y, m, d] = raw.slice(0, 10).split("-").map(Number);
          return new Date(y, m - 1, d);
        }
        let match = raw.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);
        if (match) {
          let [, d, m, y] = match;
          y = Number(y); if (y < 100) y += y < 70 ? 2000 : 1900;
          return new Date(y, Number(m) - 1, Number(d));
        }
        match = raw.match(/^(\d{1,2})[-\s]([A-Za-z]{3,9})[-\s](\d{2,4})$/);
        if (match) {
          const month = MONTHS.map(x => x.toLowerCase()).indexOf(match[2].slice(0, 3).toLowerCase());
          let year = Number(match[3]); if (year < 100) year += year < 70 ? 2000 : 1900;
          if (month >= 0) return new Date(year, month, Number(match[1]));
        }
        const parsed = new Date(raw);
        return Number.isNaN(parsed.getTime()) ? null : parsed;
      }

      function formatDate(value) {
        const date = value instanceof Date ? value : parseDate(value);
        if (!date || Number.isNaN(date.getTime())) return "—";
        return `${String(date.getDate()).padStart(2, "0")}-${MONTHS[date.getMonth()]}-${String(date.getFullYear()).slice(-2)}`;
      }

      function endOfDay(date) {
        const d = new Date(date || Date.now());
        d.setHours(23, 59, 59, 999);
        return d;
      }

      function timeMinutes(value) {
        if (value === null || value === undefined || value === "") return null;
        if (typeof value === "number" && Number.isFinite(value)) {
          const fraction = ((value % 1) + 1) % 1;
          return Math.round(fraction * 1440) % 1440;
        }
        const raw = compact(value);
        if (!raw || raw === "—" || raw === "-") return null;
        const numeric = Number(raw);
        if (Number.isFinite(numeric) && numeric >= 0 && numeric < 1) return Math.round(numeric * 1440) % 1440;
        const match = raw.match(/(?:^|\s)(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?(?:\s|$)/i);
        if (match) {
          let hours = Number(match[1]);
          const minutes = Number(match[2]);
          const suffix = (match[3] || "").toUpperCase();
          if (suffix === "PM" && hours < 12) hours += 12;
          if (suffix === "AM" && hours === 12) hours = 0;
          return (hours % 24) * 60 + minutes;
        }
        const date = new Date(raw);
        return Number.isNaN(date.getTime()) ? null : date.getHours() * 60 + date.getMinutes();
      }

      function formatTime(value) {
        const minutes = timeMinutes(value);
        if (minutes === null) return "—";
        const h24 = Math.floor(minutes / 60) % 24;
        const mins = minutes % 60;
        const suffix = h24 >= 12 ? "PM" : "AM";
        const h12 = h24 % 12 || 12;
        return `${String(h12).padStart(2, "0")}:${String(mins).padStart(2, "0")} ${suffix}`;
      }

      function durationMinutes(raw, inTime, outTime) {
        if (typeof raw === "number" && Number.isFinite(raw)) {
          if (raw > 0 && raw < 1) return Math.round(raw * 1440);
          if (raw >= 0 && raw <= 1440) return Math.round(raw);
        }
        const text = compact(raw).toLowerCase();
        if (text) {
          let match = text.match(/(\d+(?:\.\d+)?)\s*(?:min|minute)/);
          if (match) return Math.round(Number(match[1]));
          match = text.match(/(\d+(?:\.\d+)?)\s*(?:hr|hour)/);
          if (match) return Math.round(Number(match[1]) * 60);
          match = text.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
          if (match) return Number(match[1]) * 60 + Number(match[2]);
          const numeric = Number(text);
          if (Number.isFinite(numeric)) return numeric > 0 && numeric < 1 ? Math.round(numeric * 1440) : Math.round(numeric);
        }
        const start = timeMinutes(inTime);
        const finish = timeMinutes(outTime);
        if (start === null || finish === null) return null;
        return finish >= start ? finish - start : (1440 - start) + finish;
      }

      function formatDuration(minutes) {
        if (minutes === null || minutes === undefined || !Number.isFinite(Number(minutes))) return "—";
        const value = Math.max(0, Math.round(Number(minutes)));
        if (value < 60) return `${value} min`;
        const hours = Math.floor(value / 60);
        const mins = value % 60;
        return mins ? `${hours} hr ${mins} min` : `${hours} hr`;
      }

      function findArrays(value, path = "root", depth = 0, found = []) {
        if (depth > 4 || value === null || value === undefined) return found;
        if (Array.isArray(value)) {
          if (value.length && value.some(item => item && typeof item === "object" && !Array.isArray(item))) found.push({ path, value });
          return found;
        }
        if (typeof value !== "object") return found;
        for (const [key, child] of Object.entries(value)) {
          if (Array.isArray(child)) findArrays(child, `${path}.${key}`, depth + 1, found);
          else if (child && typeof child === "object") findArrays(child, `${path}.${key}`, depth + 1, found);
        }
        return found;
      }

      function arrayKeySet(array) {
        const keys = new Set();
        for (const row of array.slice(0, 10)) {
          if (!row || typeof row !== "object" || Array.isArray(row)) continue;
          Object.keys(row).forEach(key => keys.add(token(key)));
        }
        return keys;
      }

      function hasAnyKey(keys, aliases) {
        return aliases.some(alias => keys.has(token(alias)));
      }

      function recordArrayScore(array) {
        const keys = arrayKeySet(array);
        let score = 0;
        if (hasAnyKey(keys, ["outlet_code", "store_code", "outlet", "outlet_name"])) score += 6;
        if (hasAnyKey(keys, ["planned_visit_date", "planned_date", "plan_date"])) score += 5;
        if (hasAnyKey(keys, ["visit_status", "status", "completion_status"])) score += 3;
        if (hasAnyKey(keys, ["officer", "response_visit_by", "visit_by", "assigned_officer"])) score += 3;
        if (hasAnyKey(keys, ["actual_visit_date", "response_id", "in_time", "out_time", "duration"])) score += 3;
        score += Math.min(2, Math.log10(array.length + 1));
        return score;
      }

      function officerArrayScore(array) {
        const keys = arrayKeySet(array);
        let score = 0;
        if (hasAnyKey(keys, ["officer", "officer_name", "response_visit_by"])) score += 5;
        if (hasAnyKey(keys, ["planned", "due", "planned_till_date", "planned_visits_till_date"])) score += 3;
        if (hasAnyKey(keys, ["done", "completed", "completed_visits"])) score += 3;
        if (hasAnyKey(keys, ["completion", "completion_pct", "completion_percentage"])) score += 3;
        if (hasAnyKey(keys, ["outlet_code", "outlet_name", "planned_visit_date"])) score -= 5;
        return score;
      }

      function findBestArray(payload, scorer, minimum) {
        if (Array.isArray(payload)) return scorer(payload) >= minimum ? payload : [];
        const arrays = findArrays(payload);
        let best = { score: -Infinity, value: [] };
        for (const candidate of arrays) {
          const score = scorer(candidate.value);
          if (score > best.score) best = { score, value: candidate.value };
        }
        return best.score >= minimum ? best.value : [];
      }

      function findMetric(payload, aliases) {
        const targets = new Set(aliases.map(token));
        const preferred = [payload?.summary, payload?.kpis, payload?.metrics, payload?.dashboard_summary, payload?.data?.summary, payload?.data?.kpis, payload];
        const seen = new Set();

        function walk(value, depth) {
          if (!value || typeof value !== "object" || Array.isArray(value) || depth > 4 || seen.has(value)) return null;
          seen.add(value);
          for (const [key, child] of Object.entries(value)) {
            if (targets.has(token(key))) {
              const n = numberValue(child);
              if (n !== null) return n;
            }
          }
          for (const child of Object.values(value)) {
            if (child && typeof child === "object" && !Array.isArray(child)) {
              const result = walk(child, depth + 1);
              if (result !== null) return result;
            }
          }
          return null;
        }

        for (const scope of preferred) {
          const result = walk(scope, 0);
          if (result !== null) return result;
        }
        return null;
      }

      function findMetaValue(payload, aliases) {
        const targets = new Set(aliases.map(token));
        const scopes = [payload?.meta, payload?.metadata, payload?.summary, payload?.data?.meta, payload];
        for (const scope of scopes) {
          if (!scope || typeof scope !== "object" || Array.isArray(scope)) continue;
          const map = objectMap(scope);
          for (const key of targets) if (map.has(key) && map.get(key) !== "") return map.get(key);
        }
        return "";
      }

      function resolveAsOf(payload) {
        const value = findMetaValue(payload, ["snapshot_date", "as_of_date", "as_of", "generated_at", "last_updated", "build_time", "data_date"]);
        return parseDate(value) || new Date();
      }

      function normalizeStatus(raw, evidence) {
        const value = compact(raw);
        const key = token(value);
        if (/(complete|done|visited|respond|accepted|submitted)/.test(key)) return "Completed";
        if (/(pending|noresponse|outstanding|notvisited|due|remaining)/.test(key)) return "Pending";
        if (!value) return evidence ? "Completed" : "Pending";
        return value;
      }

      function normalizeRecord(raw, index) {
        const outletCode = compact(getAny(raw, ["outlet_code", "store_code", "code", "outlet id", "store id"]));
        let outletName = compact(getAny(raw, ["outlet_name", "store_name", "name", "outlet"]));
        if (!outletCode && outletName) {
          const match = outletName.match(/^([A-Za-z]\d{3,5})\s*[-–—]\s*(.+)$/);
          if (match) outletName = match[2].trim();
        }
        const officer = compact(getAny(raw, ["officer", "officer_name", "response_visit_by", "response/visit by", "visit_by", "assigned_officer", "employee_name", "visited_by"]));
        const plannedRaw = getAny(raw, ["planned_visit_date", "planned_date", "plan_date", "scheduled_date", "visit_plan_date"]);
        const actualRaw = getAny(raw, ["actual_visit_date", "actual_date", "response_date", "visit_date", "submitted_at", "submission_date"]);
        const inRaw = getAny(raw, ["in_time", "intime", "check_in", "checkin", "start_time", "visit_start_time"]);
        const outRaw = getAny(raw, ["out_time", "outtime", "check_out", "checkout", "end_time", "visit_end_time"]);
        const responseId = compact(getAny(raw, ["response_id", "responseid", "submission_id", "visit_id", "form_response_id"]));
        const remarks = compact(getAny(raw, ["remarks", "remark", "comments", "comment", "notes", "exception_reason"]));
        const evidence = Boolean(parseDate(actualRaw) || responseId || timeMinutes(inRaw) !== null || timeMinutes(outRaw) !== null);
        const status = normalizeStatus(getAny(raw, ["visit_status", "status", "completion_status", "response_status"]), evidence);
        const completed = token(status).includes("complete") || evidence;
        const duration = durationMinutes(getAny(raw, ["visit_duration", "duration", "duration_minutes", "visit_minutes"]), inRaw, outRaw);
        const plannedFlagRaw = getAny(raw, ["is_planned", "planned_visit", "scheduled", "plan_type"], null);
        const plannedFlag = plannedFlagRaw === null ? null : ![false, 0, "0", "false", "no", "unplanned", "extra"].includes(typeof plannedFlagRaw === "string" ? plannedFlagRaw.toLowerCase().trim() : plannedFlagRaw);
        return {
          id: index,
          outletCode,
          outletName,
          officer: officer || "Unassigned",
          plannedDate: parseDate(plannedRaw),
          plannedRaw,
          status,
          completed,
          inTime: inRaw,
          outTime: outRaw,
          duration,
          actualDate: parseDate(actualRaw),
          actualRaw,
          responseId,
          remarks,
          daysPendingRaw: getAny(raw, ["days_pending", "pending_days", "days_overdue"]),
          plannedFlag,
          raw
        };
      }

      function normalizeOfficerSeed(raw) {
        const officer = compact(getAny(raw, ["officer", "officer_name", "response_visit_by", "name"]));
        if (!officer) return null;
        let completion = numberValue(getAny(raw, ["completion", "completion_pct", "completion_percentage", "completion_percent", "visit_completion"]));
        if (completion !== null && completion <= 1) completion *= 100;
        return {
          officer,
          planned: numberValue(getAny(raw, ["planned_visits_till_date", "planned_till_date", "planned", "due", "due_visits"])),
          completed: numberValue(getAny(raw, ["completed_visits_till_date", "completed_visits", "completed", "done", "accepted_responses"])),
          pending: numberValue(getAny(raw, ["pending_visits", "pending", "remaining", "outstanding"])),
          completion
        };
      }

      function isPlannedTill(row, asOf = state.asOf) {
        if (row.plannedFlag === false) return false;
        if (!row.plannedDate) return row.plannedFlag === true || !row.completed;
        return row.plannedDate.getTime() <= endOfDay(asOf).getTime();
      }

      function outletKey(row) {
        return token(row.outletCode || row.outletName || `row${row.id}`);
      }

      function deriveSummary(rows) {
        const plannedRows = rows.filter(row => isPlannedTill(row));
        const completedRows = rows.filter(row => row.completed && (!row.actualDate || row.actualDate <= endOfDay(state.asOf)));
        const pendingRows = plannedRows.filter(row => !row.completed);
        const visited = new Set(completedRows.map(outletKey));
        const never = new Set(plannedRows.filter(row => !visited.has(outletKey(row))).map(outletKey));
        const planned = plannedRows.length;
        const completed = completedRows.length;
        return {
          planned,
          completed,
          pending: pendingRows.length,
          never: never.size,
          completion: planned ? (completed / planned) * 100 : 0
        };
      }

      function extractSummarySeed(payload) {
        let completion = findMetric(payload, ["visit_completion", "visit_completion_pct", "visit_completion_percentage", "completion_pct", "completion_percentage", "compliance_percentage"]);
        if (completion !== null && completion <= 1) completion *= 100;
        return {
          planned: findMetric(payload, ["planned_visits_till_date", "planned_till_date", "visits_due_by_today", "due_visits", "total_due_visits", "planned_due"]),
          completed: findMetric(payload, ["completed_visits_till_date", "completed_visits", "visits_completed", "planned_visits_completed", "done_visits", "accepted_responses"]),
          pending: findMetric(payload, ["visits_still_pending", "pending_visits", "due_visits_outstanding", "remaining_visits_no_response", "outstanding_visits"]),
          never: findMetric(payload, ["outlets_never_visited", "never_visited_outlets", "never_visited", "unvisited_outlets"]),
          completion
        };
      }

      function hasFilters() {
        return Object.values(state.filters).some(value => compact(value));
      }

      function filteredRows() {
        const outlet = token(state.filters.outlet);
        const status = token(state.filters.status);
        const officer = token(state.filters.officer);
        const officerSearch = token(state.filters.officerSearch);
        return state.rows.filter(row => {
          if (outlet && !token(`${row.outletCode} ${row.outletName}`).includes(outlet)) return false;
          if (status && token(row.status) !== status) return false;
          if (officer && token(row.officer) !== officer) return false;
          if (officerSearch && !token(row.officer).includes(officerSearch)) return false;
          return true;
        });
      }

      function summaryForRows(rows, allowSeed = false) {
        const derived = deriveSummary(rows);
        if (!allowSeed) return derived;
        const seed = state.summarySeed;
        return {
          planned: seed.planned ?? derived.planned,
          completed: seed.completed ?? derived.completed,
          pending: seed.pending ?? derived.pending,
          never: seed.never ?? derived.never,
          completion: seed.completion ?? derived.completion
        };
      }

      function formatCount(value) {
        const number = numberValue(value) ?? 0;
        return Math.round(number).toLocaleString("en-US");
      }

      function formatPct(value) {
        const number = numberValue(value) ?? 0;
        return `${number.toFixed(1)}%`;
      }

      function completionClass(value) {
        const number = Number(value) || 0;
        if (number >= 80) return "good";
        if (number >= 60) return "mid";
        return "low";
      }

      function officerSummaries(rows, allowSeed = false) {
        const grouped = new Map();
        for (const row of rows) {
          const key = row.officer || "Unassigned";
          if (!grouped.has(key)) grouped.set(key, []);
          grouped.get(key).push(row);
        }
        const computed = new Map();
        for (const [officer, officerRows] of grouped) computed.set(token(officer), { officer, ...deriveSummary(officerRows) });

        if (allowSeed) {
          for (const seed of state.officerSeed) {
            const key = token(seed.officer);
            const base = computed.get(key) || { officer: seed.officer, planned: 0, completed: 0, pending: 0, completion: 0, never: 0 };
            computed.set(key, {
              ...base,
              planned: seed.planned ?? base.planned,
              completed: seed.completed ?? base.completed,
              pending: seed.pending ?? base.pending,
              completion: seed.completion ?? base.completion
            });
          }
        }
        return Array.from(computed.values()).sort((a, b) => b.planned - a.planned || a.officer.localeCompare(b.officer));
      }

      function statusClass(row) {
        if (row.completed) return "status-completed";
        if (token(row.status).includes("pending")) return "status-pending";
        return "status-other";
      }

      function timeClass(row) {
        if (!row.completed) return "time-empty";
        if (timeMinutes(row.inTime) === null || timeMinutes(row.outTime) === null) return "time-missing";
        if (row.duration !== null && row.duration < 5) return "time-short";
        return "time-normal";
      }

      function daysPending(row) {
        const direct = compact(row.daysPendingRaw);
        if (direct) return direct;
        if (row.completed || !row.plannedDate) return "—";
        const days = Math.max(0, Math.floor((endOfDay(state.asOf) - endOfDay(row.plannedDate)) / 86400000));
        return days ? `${days} day${days === 1 ? "" : "s"}` : "Today";
      }

      function metricTitle(metric) {
        return {
          all: "All Assigned Visits",
          planned: "Planned Visits (Till Date)",
          completed: "Completed Visits (Till Date)",
          pending: "Pending Visits",
          never: "Never Visited Outlets",
          completion: "Visit Completion Breakdown"
        }[metric] || "Visit Details";
      }

      function metricRows(rows, metric) {
        if (metric === "planned") return rows.filter(row => isPlannedTill(row));
        if (metric === "completed") return rows.filter(row => row.completed);
        if (metric === "pending") return rows.filter(row => isPlannedTill(row) && !row.completed);
        if (metric === "never") {
          const visited = new Set(rows.filter(row => row.completed).map(outletKey));
          const seen = new Set();
          return rows.filter(row => {
            const key = outletKey(row);
            if (!isPlannedTill(row) || visited.has(key) || seen.has(key)) return false;
            seen.add(key);
            return true;
          });
        }
        if (metric === "completion") return rows.filter(row => isPlannedTill(row) || row.completed);
        return rows;
      }

      function kpiCards(summary) {
        return [
          { metric: "completion", label: "Visit Completion", value: formatPct(summary.completion), note: "Completed + extra visits ÷ planned till date", tone: "var(--success)" },
          { metric: "pending", label: "Visits Still Pending", value: formatCount(summary.pending), note: "No response yet", tone: "var(--danger)" },
          { metric: "never", label: "Outlets Never Visited", value: formatCount(summary.never), note: "Till snapshot date", tone: "var(--warning)" },
          { metric: "planned", label: "Planned Visits (Till Date)", value: formatCount(summary.planned), note: "Scheduled up to the snapshot date", tone: "var(--blue)" },
          { metric: "completed", label: "Completed Visits (Till Date)", value: formatCount(summary.completed), note: "Completed and extra responses", tone: "var(--success)" }
        ].map(card => `
          <button class="kpi-card" type="button" data-open-metric="${card.metric}" style="--tone:${card.tone}">
            <span class="kpi-label">${esc(card.label)}</span>
            <span class="kpi-value">${esc(card.value)}</span>
            <span class="kpi-note">${esc(card.note)}</span>
          </button>`).join("");
      }

      function officerTableHTML(officers) {
        if (!officers.length) return `<div class="empty"><strong>No officer rows available</strong>The published snapshot contains no officer-level records for the current filters.</div>`;
        return `
          <div class="table-wrap">
            <table>
              <thead><tr><th>Officer</th><th>Planned (Till Date)</th><th>Completed</th><th>Pending</th><th>Completion</th></tr></thead>
              <tbody>
                ${officers.map((row, index) => `
                  <tr>
                    <td><button class="metric-link" type="button" data-officer-index="${index}" data-officer-metric="all">${esc(row.officer)}</button></td>
                    <td><button class="metric-link" type="button" data-officer-index="${index}" data-officer-metric="planned">${formatCount(row.planned)}</button></td>
                    <td><button class="metric-link" type="button" data-officer-index="${index}" data-officer-metric="completed">${formatCount(row.completed)}</button></td>
                    <td><button class="metric-link" type="button" data-officer-index="${index}" data-officer-metric="pending">${formatCount(row.pending)}</button></td>
                    <td><button class="metric-link completion-pill ${completionClass(row.completion)}" type="button" data-officer-index="${index}" data-officer-metric="completion">${formatPct(row.completion)}</button></td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>`;
      }

      function visitTableHTML(rows, drill = false) {
        if (!rows.length) return `<div class="empty"><strong>No visit details found</strong>No outlet-level records match this metric and the current filters.</div>`;
        const visible = rows.slice(0, MAX_RENDER_ROWS);
        return `
          ${rows.length > MAX_RENDER_ROWS ? `<div class="table-note">Showing first ${formatCount(MAX_RENDER_ROWS)} of ${formatCount(rows.length)} rows. CSV download includes all rows.</div>` : ""}
          <div class="table-wrap">
            <table class="${drill ? "drill-table" : "drill-table"}">
              <thead>
                <tr>
                  <th>Outlet Code</th><th>Outlet Name</th><th>Officer</th><th>Planned Visit Date</th><th>Visit Status</th>
                  <th>In Time</th><th>Out Time</th><th>Visit Duration</th><th>Actual Visit Date</th><th>Response ID</th><th>Days Pending</th><th>Remarks</th>
                </tr>
              </thead>
              <tbody>
                ${visible.map(row => {
                  const timing = timeClass(row);
                  return `
                    <tr>
                      <td>${esc(row.outletCode || "—")}</td>
                      <td>${esc(row.outletName || "—")}</td>
                      <td>${esc(row.officer || "—")}</td>
                      <td>${esc(formatDate(row.plannedDate || row.plannedRaw))}</td>
                      <td><span class="status-pill ${statusClass(row)}"><span class="status-dot">${row.completed ? "✓" : "●"}</span>${esc(row.status)}</span></td>
                      <td><span class="time-pill ${timing}">${esc(formatTime(row.inTime))}</span></td>
                      <td><span class="time-pill ${timing}">${esc(formatTime(row.outTime))}</span></td>
                      <td><span class="time-pill ${timing}">${esc(formatDuration(row.duration))}</span></td>
                      <td>${esc(formatDate(row.actualDate || row.actualRaw))}</td>
                      <td>${esc(row.responseId || "—")}</td>
                      <td>${esc(daysPending(row))}</td>
                      <td>${esc(row.remarks || "—")}</td>
                    </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>`;
      }

      function definitionsHTML() {
        const cards = [
          ["Planned Visits (Till Date)", "Total visits already scheduled up to the published snapshot date. This replaces the confusing ‘Due Visits’ label."],
          ["Completed Visits (Till Date)", "Completed planned visits plus extra/unplanned responses, exactly as classified in the existing published dashboard data."],
          ["Visits Still Pending", "Planned visits up to the snapshot date for which the existing dataset has no completed response."],
          ["Outlets Never Visited", "Distinct planned outlets with no recorded completed visit up to the snapshot date."],
          ["Visit Completion %", "The existing dashboard completion value. Where the source publishes the KPI, this interface displays that value directly."],
          ["Timing Exceptions", "Completed visits with missing In/Out Time are red; visits under 5 minutes are amber; normal-duration visits are green."]
        ];
        return `
          <div class="definitions-grid">
            ${cards.map(([title, text]) => `<article class="section-card definition-card"><h3>${esc(title)}</h3><p>${esc(text)}</p></article>`).join("")}
            <div class="rule-lock"><span aria-hidden="true">🔒</span><div><b>Business rules are locked.</b> This file changes labels, layout, filters, theme and click-through presentation only. It does not edit FS1, the raw Excel files, the build script, the workflow, or the published JSON snapshot.</div></div>
          </div>`;
      }

      function render() {
        if (!state.payload) return;
        const rows = filteredRows();
        const allowSeed = !hasFilters();
        const summary = summaryForRows(rows, allowSeed);
        const officers = officerSummaries(rows, allowSeed);
        state.currentOfficers = officers;

        if (state.activeTab === "summary") {
          content.innerHTML = `
            <div class="summary-layout">
              <div class="kpi-grid">${kpiCards(summary)}</div>
              <section class="section-card">
                <div class="section-head"><h2>Officer performance</h2><p>Click any metric to drill down</p></div>
                ${officerTableHTML(officers)}
              </section>
            </div>`;
        } else if (state.activeTab === "officers") {
          content.innerHTML = `
            <section class="section-card">
              <div class="section-head"><h2>Officer performance</h2><p>${formatCount(officers.length)} officers · click any number for outlet details</p></div>
              ${officerTableHTML(officers)}
            </section>`;
        } else if (state.activeTab === "outlets") {
          content.innerHTML = `
            <section class="section-card">
              <div class="section-head"><h2>Outlet visit details</h2><p>${formatCount(rows.length)} rows after filters</p></div>
              ${visitTableHTML(rows)}
            </section>`;
        } else {
          content.innerHTML = definitionsHTML();
        }
        bindDynamicEvents();
      }

      function bindDynamicEvents() {
        $$('[data-open-metric]', content).forEach(button => {
          button.addEventListener("click", () => openDrawer(button.dataset.openMetric));
        });
        $$('[data-officer-index]', content).forEach(button => {
          button.addEventListener("click", () => {
            const row = state.currentOfficers?.[Number(button.dataset.officerIndex)];
            if (row) openDrawer(button.dataset.officerMetric, row.officer);
          });
        });
      }

      function openDrawer(metric = "all", officer = "") {
        let baseRows = filteredRows();
        if (officer) baseRows = baseRows.filter(row => token(row.officer) === token(officer));
        const rows = metricRows(baseRows, metric);
        let summary = summaryForRows(baseRows, !hasFilters() && !officer);
        if (officer) {
          const seed = state.officerSeed.find(item => token(item.officer) === token(officer));
          if (seed) summary = {
            ...summary,
            planned: seed.planned ?? summary.planned,
            completed: seed.completed ?? summary.completed,
            pending: seed.pending ?? summary.pending,
            completion: seed.completion ?? summary.completion
          };
        }
        state.drawer = { metric, officer, baseRows, rows, summary };
        $("#drawer-title").textContent = officer ? `${officer} Performance` : metricTitle(metric);
        $("#drawer-subtitle").textContent = `${metricTitle(metric)} · ${formatCount(rows.length)} outlet-level row${rows.length === 1 ? "" : "s"} · snapshot ${formatDate(state.asOf)}`;
        renderDrawer();
        $("#drawer-backdrop").hidden = false;
        document.body.style.overflow = "hidden";
        $("#drawer-close").focus();
      }

      function renderDrawer() {
        const drawer = state.drawer;
        if (!drawer) return;
        const summary = drawer.summary;
        const buttons = [
          ["planned", "Planned (Till Date)", formatCount(summary.planned)],
          ["completed", "Completed", formatCount(summary.completed)],
          ["pending", "Pending", formatCount(summary.pending)],
          ["completion", "Completion", formatPct(summary.completion)]
        ];
        $("#drawer-body").innerHTML = `
          <div class="drawer-summary">
            ${buttons.map(([metric, label, value]) => `<button class="mini-kpi ${drawer.metric === metric ? "active" : ""}" type="button" data-drawer-metric="${metric}"><span>${esc(label)}</span><strong>${esc(value)}</strong></button>`).join("")}
          </div>
          <section class="section-card">
            <div class="section-head"><h2>${esc(metricTitle(drawer.metric))}</h2><p>In/Out exceptions: red · under 5 min: amber · normal: green</p></div>
            ${visitTableHTML(drawer.rows, true)}
          </section>`;
        $$('[data-drawer-metric]', $("#drawer-body")).forEach(button => {
          button.addEventListener("click", () => {
            drawer.metric = button.dataset.drawerMetric;
            drawer.rows = metricRows(drawer.baseRows, drawer.metric);
            $("#drawer-subtitle").textContent = `${metricTitle(drawer.metric)} · ${formatCount(drawer.rows.length)} outlet-level row${drawer.rows.length === 1 ? "" : "s"} · snapshot ${formatDate(state.asOf)}`;
            renderDrawer();
          });
        });
      }

      function closeDrawer() {
        $("#drawer-backdrop").hidden = true;
        document.body.style.overflow = "";
        state.drawer = null;
      }

      function csvValue(value) {
        const text = String(value ?? "");
        return `"${text.replace(/"/g, '""')}"`;
      }

      function rowsToCSV(rows) {
        const headers = ["Outlet Code", "Outlet Name", "Officer", "Planned Visit Date", "Visit Status", "In Time", "Out Time", "Visit Duration", "Actual Visit Date", "Response ID", "Days Pending", "Remarks"];
        const lines = [headers.map(csvValue).join(",")];
        for (const row of rows) {
          lines.push([
            row.outletCode, row.outletName, row.officer, formatDate(row.plannedDate || row.plannedRaw), row.status,
            formatTime(row.inTime), formatTime(row.outTime), formatDuration(row.duration), formatDate(row.actualDate || row.actualRaw),
            row.responseId, daysPending(row), row.remarks
          ].map(csvValue).join(","));
        }
        return "\ufeff" + lines.join("\r\n");
      }

      function downloadCSV(rows, filename) {
        const blob = new Blob([rowsToCSV(rows)], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function populateFilters() {
        const statuses = Array.from(new Set(state.rows.map(row => row.status).filter(Boolean))).sort();
        const officers = Array.from(new Set(state.rows.map(row => row.officer).filter(Boolean))).sort((a, b) => a.localeCompare(b));
        $("#status-filter").innerHTML = `<option value="">All statuses</option>${statuses.map(value => `<option value="${esc(value)}">${esc(value)}</option>`).join("")}`;
        $("#officer-filter").innerHTML = `<option value="">All officers</option>${officers.map(value => `<option value="${esc(value)}">${esc(value)}</option>`).join("")}`;
      }

      function setStatus(message, mode = "success", showRetry = false) {
        statusBar.className = `status-bar ${mode}`;
        statusText.innerHTML = message;
        $("#retry-load").hidden = !showRetry;
      }

      function initializePayload(payload, sourceUrl) {
        if (typeof payload === "string") {
          try { payload = JSON.parse(payload); } catch (_) { /* keep original for error below */ }
        }
        if (!payload || typeof payload !== "object") throw new Error("The published dashboard file is not valid JSON data.");
        const rawRecords = findBestArray(payload, recordArrayScore, 5);
        const rawOfficers = findBestArray(payload, officerArrayScore, 5);
        state.payload = payload;
        state.sourceUrl = sourceUrl;
        state.asOf = resolveAsOf(payload);
        state.rows = rawRecords.map(normalizeRecord);
        state.officerSeed = rawOfficers.map(normalizeOfficerSeed).filter(Boolean);
        state.summarySeed = extractSummarySeed(payload);

        populateFilters();
        $("#snapshot-label").textContent = `Last snapshot: ${formatDate(state.asOf)}`;
        $("#source-label").textContent = sourceUrl.includes("last_good") ? "Google Drive Snapshot" : "Google Drive Live";
        const recordMessage = state.rows.length ? `${formatCount(state.rows.length)} outlet-level rows loaded` : "summary metrics loaded; no outlet-level array was found";
        setStatus(`<span><strong>Data connected.</strong> ${recordMessage}. Rules remain source-controlled.</span>`);
        render();
      }

      async function loadData() {
        state.payload = null;
        content.innerHTML = `<div class="loading-shimmer"></div>`;
        setStatus("<span>Connecting to the published dashboard snapshot…</span>", "success", false);
        const globals = [window.__VISIT_DASHBOARD_DATA__, window.DASHBOARD_DATA, window.dashboardData].filter(Boolean);
        if (globals.length) {
          initializePayload(globals[0], "embedded dashboard data");
          return;
        }
        const errors = [];
        for (const path of DATA_PATHS) {
          try {
            const response = await fetch(`${path}${path.includes("?") ? "&" : "?"}v=${Date.now()}`, { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const payload = await response.json();
            initializePayload(payload, path);
            return;
          } catch (error) {
            errors.push(`${path}: ${error.message}`);
          }
        }
        content.innerHTML = `<section class="section-card"><div class="empty"><strong>Dashboard snapshot could not be loaded</strong>The interface is ready, but the published data file was not found at the normal live or last-good paths.</div></section>`;
        setStatus(`<span><strong>Data connection failed.</strong> Keep the existing <code>data/dashboard_data.json</code> or <code>data/dashboard_data_last_good.json</code> in the published site.</span>`, "error", true);
        console.warn("Visit dashboard data attempts:", errors);
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem("visit-dashboard-theme", theme);
        $("#theme-toggle").textContent = theme === "dark" ? "Light theme" : "Dark theme";
        $("#theme-toggle").setAttribute("aria-label", `Switch to ${theme === "dark" ? "light" : "dark"} theme`);
      }

      function bindStaticEvents() {
        $("#theme-toggle").addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
        $$('[data-tab]').forEach(tab => tab.addEventListener("click", () => {
          state.activeTab = tab.dataset.tab;
          $$('[data-tab]').forEach(item => item.setAttribute("aria-selected", String(item === tab)));
          render();
        }));

        const controls = [
          ["#outlet-filter", "outlet", "input"],
          ["#status-filter", "status", "change"],
          ["#officer-filter", "officer", "change"],
          ["#officer-search", "officerSearch", "input"]
        ];
        for (const [selector, key, event] of controls) {
          $(selector).addEventListener(event, e => { state.filters[key] = e.target.value; render(); });
        }

        $("#reset-filters").addEventListener("click", () => {
          state.filters = { outlet: "", status: "", officer: "", officerSearch: "" };
          $("#outlet-filter").value = "";
          $("#status-filter").value = "";
          $("#officer-filter").value = "";
          $("#officer-search").value = "";
          render();
        });
        $("#download-visible").addEventListener("click", () => downloadCSV(filteredRows(), `visit-compliance-visible-${formatDate(state.asOf).replace(/-/g, "")}.csv`));
        $("#retry-load").addEventListener("click", loadData);
        $("#drawer-close").addEventListener("click", closeDrawer);
        $("#drawer-download").addEventListener("click", () => {
          if (state.drawer) downloadCSV(state.drawer.rows, `visit-compliance-${state.drawer.metric}-${formatDate(state.asOf).replace(/-/g, "")}.csv`);
        });
        $("#drawer-backdrop").addEventListener("click", event => { if (event.target === $("#drawer-backdrop")) closeDrawer(); });
        document.addEventListener("keydown", event => { if (event.key === "Escape" && !$("#drawer-backdrop").hidden) closeDrawer(); });
      }

      const storedTheme = localStorage.getItem("visit-dashboard-theme");
      const preferredTheme = window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      applyTheme(storedTheme === "dark" || storedTheme === "light" ? storedTheme : preferredTheme);
      bindStaticEvents();
      loadData();
    })();
  </script>
</body>
</html>
