name: Deploy Visit Compliance Dashboard

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "site/data/dashboard_data.json"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "visit-compliance-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build dashboard or preserve last successful data
        run: python scripts/build.py

      - name: Verify dashboard data
        run: |
          test -f site/index.html
          test -f site/data/dashboard_data.json
          python - <<'PY'
          import json
          with open("site/data/dashboard_data.json", encoding="utf-8") as f:
              data = json.load(f)
          if not isinstance(data, dict) or not data:
              raise SystemExit("site/data/dashboard_data.json is empty or invalid")
          print("Valid dashboard data")
          print("Generated at:", data.get("metadata", {}).get("generatedAt", "unknown"))
          PY

      - name: Persist last successful dashboard data in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f site/data/dashboard_data.json

          if git diff --cached --quiet; then
            echo "No dashboard data change to persist."
          else
            git commit -m "chore: persist last successful dashboard data [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
