name: Deploy Visit Compliance Dashboard

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "site/data/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "visit-compliance-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build dashboard or preserve last successful data
        run: python scripts/build.py

      # This makes the workflow safe even during the one-time transition from
      # the older build.py, which only creates dashboard_data.json. Once the
      # newer build.py is uploaded, it creates the same files itself.
      - name: Bootstrap last-good snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          data_dir = Path("site/data")
          pairs = (
              ("dashboard_data.json", "dashboard_data_last_good.json"),
              ("audit_data.json", "audit_data_last_good.json"),
          )
          for current_name, backup_name in pairs:
              current = data_dir / current_name
              backup = data_dir / backup_name
              if current.exists() and current.stat().st_size and not backup.exists():
                  shutil.copyfile(current, backup)
                  print(f"Created {backup_name} from {current_name}")
              elif current.exists():
                  print(f"Keeping existing {backup_name}")
          PY

      - name: Verify dashboard data
        run: |
          test -f site/index.html
          test -f site/data/dashboard_data.json
          python - <<'PY'
          import json
          from pathlib import Path

          data_dir = Path("site/data")
          for name in ("dashboard_data.json", "dashboard_data_last_good.json"):
              with (data_dir / name).open(encoding="utf-8") as f:
                  data = json.load(f)
              if not isinstance(data, dict) or not data:
                  raise SystemExit(f"site/data/{name} is empty or invalid")
              print(f"Valid {name}: {data.get('metadata', {}).get('generatedAt', 'unknown')}")

          for name in ("audit_data.json", "audit_data_last_good.json"):
              path = data_dir / name
              if not path.exists():
                  print(f"No {name} yet; Audit page will use its retained browser copy until an Answer Details export is uploaded once.")
                  continue
              with path.open(encoding="utf-8") as f:
                  audit = json.load(f)
              if not isinstance(audit, dict) or not audit.get("rows") or not audit.get("fields"):
                  raise SystemExit(f"site/data/{name} is empty or invalid")
              print(f"Valid {name}: {len(audit['rows']):,} answers")
          PY

      - name: Persist last successful dashboard snapshots in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Persist both current and last-good snapshots.  These are the only
          # generated files that the deployed pages need after raw Excel files
          # are deleted from data/.
          git add -f site/data

          if git diff --cached --quiet; then
            echo "No dashboard data change to persist."
          else
            git commit -m "chore: persist last successful dashboard data [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
